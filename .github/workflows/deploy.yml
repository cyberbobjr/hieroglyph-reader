# Publication automatique sur GitHub Pages.
# À chaque envoi sur la branche main : tests, construction, puis mise en ligne
# sur https://cyberbobjr.github.io/hieroglyph-reader/
#
# Prérequis (une seule fois) : dans le dépôt GitHub, Settings → Pages →
# « Build and deployment » → Source : « GitHub Actions ».
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # bouton « Run workflow » pour relancer à la main

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on n'interrompt pas une publication en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Construction
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
